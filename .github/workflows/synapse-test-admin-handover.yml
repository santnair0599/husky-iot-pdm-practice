name: Husky TEST - One-time Synapse Administrator handover

# ONE-TIME, TEMPORARY. Delete this file in a reviewed commit after a successful run.
#
# Why it exists: the pipeline identity (sp-husky-pdm-test) created the Test Synapse
# workspace, so Azure made it the only Synapse Administrator. Only a Synapse
# Administrator can grant that role, so the human admin cannot add themselves.
# This workflow uses the Test identity once to grant Synapse Administrator to the
# human admin, and does nothing else. Removing the deployer's own role is done
# afterwards BY THE HUMAN, after verifying access (docs/test-environment.md).
#
# Fixed targets, no inputs: workspace syn-husky-pdm-test-0599, principal
# ed6b656a-82f9-4609-ab71-8333d50fbe4f (User). If the grant fails, the run fails;
# it never widens the deployer's permissions to work around it.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: husky-synapse-handover-test
  cancel-in-progress: false

env:
  EXPECTED_SUBSCRIPTION: 1b0f0a4d-525c-4fac-ad07-dffbe66dd248
  EXPECTED_RG: rg-husky-pdm-test
  WORKSPACE: syn-husky-pdm-test-0599
  ADMIN_OBJECT_ID: ed6b656a-82f9-4609-ab71-8333d50fbe4f
  DEPLOYER_OBJECT_ID: 40e96239-18b0-45e2-9391-9335e2796fbd
  ROLE: Synapse Administrator

jobs:
  approval:
    name: Approve Synapse handover (TEST)
    runs-on: ubuntu-latest
    # Reviewer gate only: no OIDC trust, no Azure access
    environment: test-approval
    steps:
      - name: Branch guard
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Run only from main (got $GITHUB_REF)"; exit 1
          fi
          echo "Approved: grant '$ROLE' on $WORKSPACE to $ADMIN_OBJECT_ID (commit $GITHUB_SHA)"

  handover:
    name: Grant Synapse Administrator to the human admin
    needs: approval
    runs-on: ubuntu-latest
    environment: test

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Branch guard
        run: |
          [ "$GITHUB_REF" = "refs/heads/main" ] || { echo "::error::Run only from main"; exit 1; }

      - name: Azure OIDC Login (Test identity)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Pre-checks (subscription, workspace, identity)
        id: pre
        run: |
          sub=$(az account show --query id -o tsv)
          [ "$sub" = "$EXPECTED_SUBSCRIPTION" ] || { echo "::error::Subscription is $sub, expected $EXPECTED_SUBSCRIPTION"; exit 1; }

          caller=$(az account show --query user.name -o tsv)
          [ "$caller" = "${{ vars.AZURE_CLIENT_ID }}" ] || { echo "::error::Signed in as $caller, not the Test deployer"; exit 1; }

          ws_rg=$(az synapse workspace show --name "$WORKSPACE" --resource-group "$EXPECTED_RG" --query resourceGroup -o tsv)
          ws_id=$(az synapse workspace show --name "$WORKSPACE" --resource-group "$EXPECTED_RG" --query id -o tsv)
          [ "${ws_rg,,}" = "${EXPECTED_RG,,}" ] || { echo "::error::Workspace is in '$ws_rg'"; exit 1; }
          case "$ws_id" in
            "/subscriptions/$EXPECTED_SUBSCRIPTION/resourceGroups/$EXPECTED_RG/providers/Microsoft.Synapse/workspaces/$WORKSPACE") ;;
            *) echo "::error::Unexpected workspace ID: $ws_id"; exit 1 ;;
          esac

          echo "Subscription: $sub"
          echo "Caller (client ID): $caller"
          echo "Workspace ID: $ws_id"
          echo "ws_id=$ws_id" >> "$GITHUB_OUTPUT"

      # The role-assignment API is the workspace dev endpoint, which the Synapse
      # firewall protects. Test has no permanent rules, so allow this runner only.
      - name: Open Synapse firewall for this runner
        run: |
          ip=$(curl -fsS https://api.ipify.org)
          echo "Runner IP: $ip"
          az synapse workspace firewall-rule create \
            --name "gh-handover-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --workspace-name "$WORKSPACE" --resource-group "$EXPECTED_RG" \
            --start-ip-address "$ip" --end-ip-address "$ip" --output none
          # Wait until the dev endpoint answers this runner
          for i in $(seq 1 10); do
            if az synapse role assignment list --workspace-name "$WORKSPACE" --output none 2>/dev/null; then
              echo "Dev endpoint reachable after $i attempt(s)"; exit 0
            fi
            sleep 30
          done
          echo "::error::Synapse dev endpoint still unreachable after 5 minutes"; exit 1

      - name: Role assignments BEFORE
        run: |
          az synapse role assignment list --workspace-name "$WORKSPACE" \
            --query "[].{id:id, roleId:roleDefinitionId, principal:principalId, type:principalType, scope:scope}" -o table

      - name: Grant Synapse Administrator to the human admin (only)
        run: |
          existing=$(az synapse role assignment list --workspace-name "$WORKSPACE" \
            --role "$ROLE" --assignee-object-id "$ADMIN_OBJECT_ID" --query "length(@)" -o tsv)
          if [ "$existing" != "0" ]; then
            echo "Already assigned; nothing to grant."
          else
            # If this fails, stop: never widen the deployer's rights to make it work
            az synapse role assignment create --workspace-name "$WORKSPACE" \
              --role "$ROLE" \
              --assignee-object-id "$ADMIN_OBJECT_ID" \
              --assignee-principal-type User \
              --scope "workspaces/$WORKSPACE" \
              --output none
          fi

      - name: Verify and record evidence
        run: |
          rows=$(az synapse role assignment list --workspace-name "$WORKSPACE" \
            --role "$ROLE" --assignee-object-id "$ADMIN_OBJECT_ID" \
            --query "[?scope=='workspaces/$WORKSPACE'].{id:id, principal:principalId, type:principalType, scope:scope}" -o json)
          echo "$rows"
          count=$(echo "$rows" | jq 'length')
          [ "$count" -ge 1 ] || { echo "::error::Assignment not found at workspace scope"; exit 1; }
          assignment_id=$(echo "$rows" | jq -r '.[0].id')
          {
            echo "## Synapse Administrator handover (TEST)"
            echo "| Item | Value |"
            echo "|---|---|"
            echo "| Run | ${GITHUB_RUN_ID} (attempt ${GITHUB_RUN_ATTEMPT}) |"
            echo "| Commit | ${GITHUB_SHA} |"
            echo "| Workspace | ${WORKSPACE} |"
            echo "| Granted to | ${ADMIN_OBJECT_ID} (User) |"
            echo "| Role | ${ROLE} |"
            echo "| Assignment ID | ${assignment_id} |"
            echo ""
            echo "Next, by the human admin after verifying access: remove the deployer's (${DEPLOYER_OBJECT_ID}) ${ROLE} role, then delete this workflow."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Role assignments AFTER
        if: always()
        run: |
          az synapse role assignment list --workspace-name "$WORKSPACE" \
            --query "[].{id:id, roleId:roleDefinitionId, principal:principalId, type:principalType, scope:scope}" -o table || true

      - name: Close Synapse firewall
        if: always()
        run: |
          az synapse workspace firewall-rule delete \
            --name "gh-handover-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --workspace-name "$WORKSPACE" --resource-group "$EXPECTED_RG" \
            --yes --output none \
            || echo "::warning::Remove firewall rule gh-handover-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT} by hand"
          az synapse workspace firewall-rule list --workspace-name "$WORKSPACE" --resource-group "$EXPECTED_RG" --query "[].name" -o tsv
