name: Deploy Husky DEV

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: husky-terraform-dev
  cancel-in-progress: false

jobs:
  deploy:
    name: Terraform DEV
    runs-on: ubuntu-latest
    environment: dev

    permissions:
      contents: read
      id-token: write

    env:
      ARM_USE_OIDC: "true"
      ARM_USE_AZUREAD: "true"
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"

      # terraform.tfvars is git-ignored, so CI reads the same values
      # from the GitHub "dev" environment (variables) and secrets
      TF_VAR_environment: ${{ vars.TF_ENVIRONMENT }}
      TF_VAR_location: ${{ vars.TF_LOCATION }}
      TF_VAR_resource_group_name: ${{ vars.TF_RESOURCE_GROUP_NAME }}
      TF_VAR_storage_account_name: ${{ vars.TF_STORAGE_ACCOUNT_NAME }}
      TF_VAR_iot_hub_name: ${{ vars.TF_IOT_HUB_NAME }}
      TF_VAR_adx_cluster_name: ${{ vars.TF_ADX_CLUSTER_NAME }}
      TF_VAR_adx_admin_object_id: ${{ vars.TF_ADX_ADMIN_OBJECT_ID }}
      TF_VAR_synapse_workspace_name: ${{ vars.TF_SYNAPSE_WORKSPACE_NAME }}
      TF_VAR_synapse_location: ${{ vars.TF_SYNAPSE_LOCATION }}
      TF_VAR_synapse_managed_resource_group_name: ${{ vars.TF_SYNAPSE_MANAGED_RG_NAME }}
      TF_VAR_alert_email: ${{ secrets.ALERT_EMAIL }}

    defaults:
      run:
        working-directory: infra/terraform/envs/dev

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          # Must be >= the version that last wrote the state (laptop: 1.15.5)
          terraform_version: "1.15.5"
          terraform_wrapper: false

      - name: Azure login using OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Verify Azure subscription
        run: |
          az account show \
            --query "{name:name,id:id}" \
            --output json

      - name: Check ADX cluster is running
        run: |
          state=$(az kusto cluster show \
            --name "$TF_VAR_adx_cluster_name" \
            --resource-group "$TF_VAR_resource_group_name" \
            --query state -o tsv)
          echo "ADX state: $state"
          if [ "$state" != "Running" ]; then
            echo "::error::ADX cluster is $state. Start it before running this workflow (plan cannot read KQL scripts while stopped)."
            exit 1
          fi

      - name: Terraform Init
        run: |
          terraform init -reconfigure \
            -backend-config="storage_account_name=${{ vars.TF_STATE_STORAGE_ACCOUNT }}" \
            -backend-config="container_name=tfstate-dev" \
            -backend-config="key=husky-dev.tfstate"

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan - no-change check
        shell: bash
        run: |
          set +e
          terraform plan \
            -lock-timeout=5m \
            -out=dev.tfplan \
            -detailed-exitcode

          exit_code=$?
          set -e

          if [ "$exit_code" -eq 1 ]; then
            echo "Terraform planning failed."
            exit 1
          fi

          if [ "$exit_code" -eq 2 ]; then
            echo "Infrastructure changes detected."
            echo "No deployment will be performed."
            terraform show -no-color dev.tfplan
            exit 1
          fi

          echo "No infrastructure changes detected."

      - name: Verify existing state only
        run: terraform state list
